<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Sales Cloud Simulator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f7;
        }

        .header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid #ddd;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            padding: 24px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            background: white;
        }

        .payload {
            margin-top: 24px;
            padding: 16px;
            background: #1e1e1e;
            color: #00ff88;
            white-space: pre-wrap;
            font-family: monospace;
            min-height: 150px;
        }
    </style>
</head>

<body>

    <div class="header">
        ☁️ Sales Cloud Simulator
    </div>

    <div class="container">

        <h3>CTI Widget</h3>

        <iframe
            id="ctiWidget"
            src="/cti-widget/webapp/index.html"
            title="CTI Widget">
        </iframe>

        <h3>CRM Call State</h3>

      <div
          id="crmState"
          style="
              background: white;
              padding: 16px;
              border: 1px solid #ddd;
              margin-bottom: 24px;
          ">
          Waiting for call...
      </div>

        <h3>Received from CTI Widget</h3>

        <div
            id="payload"
            class="payload">
            Waiting for CTI message...
        </div>

    </div>

    <script>

const ctiWidget = document.getElementById("ctiWidget");

window.addEventListener("message", event => {

    if (event.source !== ctiWidget.contentWindow) {
        return;
    }

    console.log("📨 Message received from CTI Widget:");
    console.log(event.data);

    const payload = document.getElementById("payload");

    if (typeof event.data !== "string") {
        return;
    }

    const xml = event.data;

    payload.textContent = xml;

    const parser = new DOMParser();
    const xmlDocument = parser.parseFromString(xml, "application/xml");

    const type = xmlDocument.querySelector("Type")?.textContent || "";
    const eventType = xmlDocument.querySelector("EventType")?.textContent || "";
    const action = xmlDocument.querySelector("Action")?.textContent || "";
    const ani = xmlDocument.querySelector("ANI")?.textContent || "";
    const externalReferenceId =
        xmlDocument.querySelector("ExternalReferenceID")?.textContent || "";

    console.log("📋 Parsed CTI payload:", {
        type,
        eventType,
        action,
        ani,
        externalReferenceId
    });

const crmState = document.getElementById("crmState");

let status = "Unknown";

if (action === "NOTIFY") {
    status = "Incoming call notification";
}

if (action === "ACCEPT") {
    status = "Call accepted";
}

if (action === "END") {
    status = "Call ended";
}

crmState.innerHTML = `
    <strong>${status}</strong>
    <br><br>
    Event Type: ${eventType}
    <br>
    Action: ${action}
    <br>
    Caller: ${ani}
    <br>
    Call ID: ${externalReferenceId}
`;

});

    </script>

</body>
</html>
